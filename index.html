<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYNET 1.2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #030914;
  color: #00d9ff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 25px 15px;
  text-align: center;
}

h1 {
  font-size: 42px;
  letter-spacing: 5px;
  text-shadow: 0 0 25px #00d9ff;
}

.status {
  color: #80eaff;
  margin-bottom: 25px;
  min-height: 25px;
}

.chat {
  height: 320px;
  overflow-y: auto;
  background: #071525;
  border: 1px solid #087fa0;
  border-radius: 15px;
  padding: 15px;
  text-align: left;
  margin-bottom: 25px;
}

.message {
  margin-bottom: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user {
  color: white;
}

.bot {
  color: #00d9ff;
}

.system {
  color: #ffcc66;
}

.mic {
  width: 115px;
  height: 115px;
  border-radius: 50%;
  border: 2px solid #00d9ff;
  background: #062338;
  color: #00d9ff;
  font-size: 45px;
  box-shadow: 0 0 30px #0088aa;
  cursor: pointer;
}

.mic.active {
  background: #005577;
  box-shadow: 0 0 45px #00d9ff;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 25px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #087fa0;
  background: #071525;
  color: white;
  font-size: 16px;
}

.send {
  padding: 12px 18px;
  background: #00cfff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.info {
  font-size: 13px;
  color: #7c9eaf;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>SKYNET</h1>

<div class="status" id="status">
SYSTEM BEREIT
</div>

<div class="chat" id="chat">
  <div class="message bot">
    SKYNET: System bereit.
    Sprachsteuerung Version 1.2 initialisiert.
  </div>
</div>

<button
  class="mic"
  id="mic"
  type="button"
  onclick="toggleListening()">
  🎤
</button>

<p id="hint">
Zum Sprechen Mikrofon antippen
</p>

<div class="controls">
  <input
    type="text"
    id="input"
    placeholder="Nachricht eingeben..."
  >
  <button
    class="send"
    onclick="sendText()">
    SENDEN
  </button>
</div>

<p class="info">
SKYNET 1.2 | VOICE DIAGNOSTICS
</p>

</div>

<script>

const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const mic = document.getElementById("mic");
const input = document.getElementById("input");
const hint = document.getElementById("hint");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;
let receivedResult = false;
let recognitionError = false;
let manuallyStopped = false;

function addMessage(sender, text) {
  const div = document.createElement("div");

  div.className = "message " +
    (sender === "DU" ? "user" :
     sender === "SYSTEM" ? "system" : "bot");

  div.textContent = sender + ": " + text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setStatus(text) {
  statusText.textContent = text;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    addMessage(
      "SYSTEM",
      "Sprachausgabe nicht unterstützt."
    );
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "de-DE";
  speech.rate = 0.9;
  speech.pitch = 0.75;
  speech.volume = 1;

  window.speechSynthesis.speak(speech);
}

function respond(text) {
  const message = text.toLowerCase();
  let answer;

  if (message.includes("hallo")) {
    answer = "Hallo. SKYNET ist einsatzbereit.";
  }
  else if (message.includes("systemtest")) {
    answer = "Systemtest erfolgreich.";
  }
  else if (message.includes("wie heißt du")) {
    answer = "Meine Bezeichnung lautet SKYNET.";
  }
  else if (message.includes("status")) {
    answer = "SKYNET Version 1 Punkt 2 ist aktiv.";
  }
  else if (message.includes("test")) {
    answer = "Sprachtest erfolgreich.";
  }
  else {
    answer =
      "Befehl empfangen. Die KI-Verbindung ist noch nicht aktiviert.";
  }

  addMessage("SKYNET", answer);
  speak(answer);
}

function sendText() {
  const text = input.value.trim();

  if (!text) return;

  addMessage("DU", text);
  input.value = "";

  respond(text);
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendText();
  }
});

function toggleListening() {
  if (listening && recognition) {
    manuallyStopped = true;
    recognition.stop();
    return;
  }

  startListening();
}

function startListening() {

  if (!SpeechRecognition) {
    setStatus("NICHT UNTERSTÜTZT");

    addMessage(
      "SYSTEM",
      "Dieser Browser unterstützt die Web Speech API nicht."
    );
    return;
  }

  if (listening) return;

  receivedResult = false;
  recognitionError = false;
  manuallyStopped = false;

  recognition = new SpeechRecognition();

  recognition.lang = "de-DE";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    listening = true;

    setStatus("ICH HÖRE ZU");
    mic.classList.add("active");

    hint.textContent =
      "Jetzt sprechen – erneut tippen zum Stoppen";

    addMessage(
      "SYSTEM",
      "Spracherkennung gestartet."
    );
  };

  recognition.onaudiostart = function() {
    addMessage(
      "SYSTEM",
      "Audioeingabe gestartet."
    );
  };

  recognition.onspeechstart = function() {
    setStatus("SPRACHE ERKANNT");

    addMessage(
      "SYSTEM",
      "Spracheingang erkannt."
    );
  };

  recognition.onresult = function(event) {
    let finalText = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      const result = event.results[i];

      if (result.isFinal) {
        finalText += result[0].transcript;
      }
    }

    if (finalText.trim()) {
      receivedResult = true;

      addMessage("DU", finalText.trim());
      respond(finalText.trim());
    }
  };

  recognition.onnomatch = function() {
    addMessage(
      "SYSTEM",
      "Sprache wurde nicht erkannt."
    );
  };

  recognition.onerror = function(event) {
    recognitionError = true;

    setStatus("MIKROFONFEHLER");

    addMessage(
      "SYSTEM",
      "Fehlercode: " + event.error
    );
  };

  recognition.onend = function() {
    listening = false;
    mic.classList.remove("active");

    hint.textContent =
      "Zum Sprechen Mikrofon antippen";

    if (
      !receivedResult &&
      !recognitionError &&
      !manuallyStopped
    ) {
      addMessage(
        "SYSTEM",
        "Spracherkennung beendet, aber kein endgültiges Ergebnis empfangen."
      );
    }

    if (!recognitionError) {
      setStatus("SYSTEM BEREIT");
    }

    recognition = null;
  };

  try {
    recognition.start();
  }
  catch (error) {
    listening = false;
    recognition = null;

    setStatus("STARTFEHLER");

    addMessage(
      "SYSTEM",
      "Startfehler: " + error.message
    );
  }
}

</script>

</body>
</html>
