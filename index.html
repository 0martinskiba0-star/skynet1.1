<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SKYNET 1.1</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #030914;
  color: #00d9ff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 25px 15px;
  text-align: center;
}

h1 {
  font-size: 42px;
  letter-spacing: 5px;
  text-shadow: 0 0 25px #00d9ff;
}

.status {
  color: #80eaff;
  margin-bottom: 25px;
}

.chat {
  height: 320px;
  overflow-y: auto;
  background: #071525;
  border: 1px solid #087fa0;
  border-radius: 15px;
  padding: 15px;
  text-align: left;
  margin-bottom: 25px;
}

.message {
  margin-bottom: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user {
  color: white;
}

.bot {
  color: #00d9ff;
}

.mic {
  width: 115px;
  height: 115px;
  border-radius: 50%;
  border: 2px solid #00d9ff;
  background: #062338;
  color: #00d9ff;
  font-size: 45px;
  box-shadow: 0 0 30px #0088aa;
  cursor: pointer;
}

.mic.active {
  background: #005577;
  box-shadow: 0 0 45px #00d9ff;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 25px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #087fa0;
  background: #071525;
  color: white;
  font-size: 16px;
}

.send {
  padding: 12px 18px;
  background: #00cfff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.info {
  font-size: 13px;
  color: #7c9eaf;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>SKYNET</h1>

<div class="status" id="status">
SYSTEM BEREIT
</div>

<div class="chat" id="chat">
  <div class="message bot">
    SKYNET: System bereit.
    Sprachsteuerung initialisiert.
  </div>
</div>

<button class="mic" id="mic" onclick="startListening()">
🎤
</button>

<p>Zum Sprechen Mikrofon antippen</p>

<div class="controls">
  <input
    type="text"
    id="input"
    placeholder="Nachricht eingeben..."
  >
  <button class="send" onclick="sendText()">
    SENDEN
  </button>
</div>

<p class="info">
SKYNET 1.1 | VOICE INTERFACE
</p>

</div>

<script>

const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const mic = document.getElementById("mic");
const input = document.getElementById("input");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

function addMessage(sender, text) {
  const div = document.createElement("div");
  div.className = "message " +
    (sender === "DU" ? "user" : "bot");

  div.textContent = sender + ": " + text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "de-DE";
  speech.rate = 0.9;
  speech.pitch = 0.75;
  speech.volume = 1;

  speechSynthesis.speak(speech);
}

function respond(text) {
  let answer = "";

  const message = text.toLowerCase();

  if (message.includes("hallo")) {
    answer = "Hallo. SKYNET ist einsatzbereit.";
  }
  else if (message.includes("systemtest")) {
    answer = "Systemtest erfolgreich. Alle Testfunktionen bereit.";
  }
  else if (message.includes("wie heißt du")) {
    answer = "Meine Bezeichnung lautet SKYNET.";
  }
  else if (message.includes("status")) {
    answer = "SKYNET Version 1 Punkt 1 ist aktiv.";
  }
  else {
    answer = "Befehl empfangen. Die KI-Verbindung wird in einer späteren Version aktiviert.";
  }

  addMessage("SKYNET", answer);
  speak(answer);
}

function sendText() {
  const text = input.value.trim();

  if (!text) return;

  addMessage("DU", text);
  input.value = "";

  respond(text);
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendText();
  }
});

function startListening() {

  if (!SpeechRecognition) {
    statusText.textContent =
      "SPRACHERKENNUNG NICHT VERFÜGBAR";

    addMessage(
      "SKYNET",
      "Dieser Browser unterstützt die Spracherkennung nicht."
    );
    return;
  }

  if (recognition) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "de-DE";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    statusText.textContent = "ICH HÖRE ZU";
    mic.classList.add("active");
  };

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;

    addMessage("DU", text);
    respond(text);
  };

  recognition.onerror = function(event) {
    statusText.textContent = "MIKROFONFEHLER";

    addMessage(
      "SKYNET",
      "Spracherkennung: " + event.error
    );
  };

  recognition.onend = function() {
    mic.classList.remove("active");

    if (statusText.textContent !== "MIKROFONFEHLER") {
      statusText.textContent = "SYSTEM BEREIT";
    }

    recognition = null;
  };

  try {
    recognition.start();
  }
  catch (error) {
    recognition = null;
    statusText.textContent = "MIKROFONFEHLER";
  }
}

</script>

</body>
</html>
